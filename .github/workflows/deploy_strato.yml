name: Deploy to Strato

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Upload per SFTP zu Strato
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.STRATO_USERNAME }}
          server: ${{ secrets.STRATO_HOST }}
          password: ${{ secrets.STRATO_PASSWORD }}
          port: 22
          ssh_private_key: ''
          local_path: './*'
          remote_path: '/portfolio/'
          sftp_only: true