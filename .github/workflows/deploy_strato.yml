name: Deploy to Strato

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Upload per SFTP zu Strato
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STRATO_HOST }}
          username: ${{ secrets.STRATO_USERNAME }}
          password: ${{ secrets.STRATO_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./          # Ordner mit deinen Website-Dateien im Repo
          server-dir: /portfolio/     # Zielordner auf Strato, anpassen an dein Stammverzeichnis
